<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>英語口說教練</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1d2433;--sub:#6b7386;--pri:#4f46e5;--ok:#16a34a;--bad:#dc2626;--bd:#e3e6ef;--hl:#fef3c7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10131c;--card:#1a1f2e;--tx:#eef0f6;--sub:#9aa2b8;--pri:#818cf8;--bd:#2a3145;--hl:#4a3b10}}
:root[data-theme="dark"]{--bg:#10131c;--card:#1a1f2e;--tx:#eef0f6;--sub:#9aa2b8;--pri:#818cf8;--bd:#2a3145;--hl:#4a3b10}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 12px}
button,select{font-family:inherit}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1;padding:10px 4px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;font-size:15px}
.tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;margin-bottom:12px}
.prog{font-size:13px;color:var(--sub);display:flex;justify-content:space-between}
.en{font-size:26px;font-weight:600;line-height:1.4;margin:12px 0 4px}
.en b{color:var(--pri);background:var(--hl);border-radius:6px;padding:0 4px;font-size:1.08em}
.zh{color:var(--sub);font-size:15px}
.tip{margin-top:12px;padding:10px 12px;background:var(--bg);border-radius:10px;font-size:14px}
.arrow{display:inline-block;font-size:22px;color:var(--pri);margin-left:6px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.row button{flex:1 1 45%;padding:13px 8px;font-size:15px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
.row .p{background:var(--pri);color:#fff;border-color:var(--pri)}
.row .rec{background:var(--bad);color:#fff;border-color:var(--bad)}
.row .dn{background:var(--ok);color:#fff;border-color:var(--ok)}
.speed{display:flex;gap:6px;align-items:center;margin-top:12px;font-size:14px;color:var(--sub)}
.speed button{padding:6px 12px;border-radius:99px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
.speed button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.res{margin-top:12px;font-size:16px}
.ok{color:var(--ok);font-weight:600}.no{color:var(--bad);text-decoration:underline wavy}
.nav{display:flex;gap:8px;margin-bottom:10px}
.nav button{flex:1;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:15px}
select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:15px}
audio{width:100%;margin-top:10px}
textarea{width:100%;margin-top:8px;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:15px;font-family:inherit;resize:vertical}
table{width:100%;border-collapse:collapse;margin-top:8px;font-size:15px}td,th{padding:6px;border-bottom:1px solid var(--bd);text-align:center}
small{color:var(--sub);display:block;margin-top:10px;font-size:12px}
</style>
</head>
<body>
<main>
<h1>🎙️ 英語口說教練</h1>
<div class="tabs" id="lvs"></div>
<div class="tabs" id="tabs"></div>
<div class="card" id="ed" hidden>
  <b>✍️ 貼上或上傳你的英文文章</b>
  <textarea id="txt" rows="6" placeholder="貼上英文文章（課文、新聞、演講稿、電子郵件…），按「開始練習」會自動分成一句一句，並標出重音、語調與難發音的字。"></textarea>
  <div class="row"><button class="p" id="go">開始練習</button><button id="fl">📄 上傳 .txt 檔</button><button id="clr">清除</button></div>
  <input type="file" id="file" accept=".txt,text/plain" hidden>
  <small>最多會取前 300 句。文章只存在你這支手機的瀏覽器裡，不會上傳到任何地方。Word 或 PDF 請先複製文字再貼上。</small>
</div>
<div class="card" id="pc">
  <div class="prog"><span id="cat"></span><span id="pos"></span></div>
  <div class="en" id="en"></div>
  <div class="zh" id="zh"></div>
  <div class="tip" id="tip"></div>
  <div class="speed">語速：<button data-r="0.6">慢</button><button data-r="0.85" class="on">中</button><button data-r="1">正常</button></div>
  <div class="row">
    <button class="p" id="listen">🔊 聽標準發音</button>
    <button id="record">⏺ 錄音比較</button>
    <button id="score">🎯 語音評分</button>
    <button id="done">☆ 標記熟練</button>
    <button id="board" style="flex-basis:100%">📊 計分（查看總成績）</button>
  </div>
  <audio id="aud" controls hidden></audio>
  <div class="res" id="res"></div>
</div>
<div class="card" id="panel" hidden></div>
<div class="nav" id="nv"><button id="prev">← 上一句</button><button id="rand">🔀 隨機</button><button id="next">下一句 →</button></div>
<select id="jump"></select>
<small>使用方式：先聽 → 跟著唸 → 錄音回放與原音比較。色塊標示的是重音，要唸得更重更長；箭頭表示句尾語調。語音評分需瀏覽器支援語音辨識（Chrome / Safari），首次使用請允許麥克風。進度會自動儲存在這支手機上。</small>
</main>
<script>
const plain=t=>t.replace(/\*/g,"");
const html=t=>t.replace(/\*(.+?)\*/g,"<b>$1</b>");
const nuc=s=>s.replace(/(\w+)([?.!]*)$/,"*$1*$2");

function build(){
  /* ---------- 發音：50 組對比字 × 2 ---------- */
  const G=[
   ["/ɪ/ 短而放鬆 vs /iː/ 嘴角拉開拉長","ship sheep 船 羊;bit beat 一點 打敗;live leave 居住 離開;sit seat 坐 座位"],
   ["/æ/ 嘴張大 vs /e/ 嘴張小","bad bed 壞的 床;pan pen 平底鍋 筆;bat bet 球棒 打賭"],
   ["/ʌ/ 短促 vs /ɒ/ 嘴圓張開","cup cop 杯子 警察;hut hot 小屋 熱的;luck lock 運氣 鎖"],
   ["/ʊ/ 短而放鬆 vs /uː/ 嘴唇圓突拉長","full fool 滿的 傻瓜;pull pool 拉 游泳池"],
   ["l 舌尖頂上顎 vs r 舌頭捲起但不碰上顎","light right 燈 右邊;lock rock 鎖 岩石;long wrong 長的 錯的;glass grass 玻璃杯 草;collect correct 收集 更正;lice rice 蝨子 米飯;alive arrive 活著 到達"],
   ["th 舌尖夾在牙間吹氣 vs s 舌尖在牙後","think sink 思考 下沉;thank sank 謝謝 沉了;mouth mouse 嘴巴 老鼠;path pass 小路 通過"],
   ["th /ð/ 舌尖夾在牙間 vs d 舌尖頂牙齦","then den 然後 巢穴;they day 他們 白天"],
   ["v 上齒咬下唇 vs w 嘴唇圓起","vest west 背心 西方;vine wine 藤蔓 葡萄酒;verse worse 詩句 更糟;vet wet 獸醫 濕的"],
   ["v 上齒咬下唇 vs b 雙唇爆破","very berry 非常 莓果;vote boat 投票 船;van ban 廂型車 禁令"],
   ["s 嘴角拉開 vs sh 嘴唇微圓突出","sea she 海 她;save shave 儲存 刮鬍子;sore shore 痠痛 海岸;sign shine 標誌 閃耀"],
   ["ch 爆破帶氣 vs sh 持續氣流","chair share 椅子 分享;watch wash 手錶 清洗;catch cash 抓住 現金;chop shop 砍 商店"],
   ["ch 不震動聲帶 vs j 震動聲帶","choke joke 噎住 笑話;cheap jeep 便宜 吉普車;batch badge 一批 徽章"],
   ["n 舌尖頂上顎 vs ng 舌根頂軟顎","sin sing 罪 唱歌;ran rang 跑了 響了;thin thing 瘦的 東西;win wing 贏 翅膀"],
   ["字尾 b/d/g 要有聲音，p/t/k 只收住不爆","cab cap 計程車 帽子;bag back 袋子 背後;card cart 卡片 推車"],
   ["/ɪ/ 嘴放鬆 vs /e/ 嘴稍開","pick peck 挑選 啄;big beg 大的 乞求;pit pet 坑洞 寵物"],
   ["f 上齒咬下唇吹氣 vs p 雙唇爆破","fast past 快的 過去;fine pine 很好 松樹;fork pork 叉子 豬肉"],
   ["z 聲帶震動 vs s 聲帶不震動","peace peas 和平 豌豆;price prize 價格 獎品;bus buzz 公車 嗡嗡聲;ice eyes 冰塊 眼睛"],
   ["/æ/ 嘴張大 vs /ʌ/ 嘴張小而短","bag bug 袋子 蟲;match much 火柴 很多;ankle uncle 腳踝 叔叔;cat cut 貓 切"],
   ["/ɑː/ 嘴張大拉長 vs /æ/ 短促","heart hat 心臟 帽子;park pack 公園 包裹;hard had 困難的 有(過去式)"],
   ["/eɪ/ 滑音 vs /e/ 單音","late let 遲到 讓;tale tell 故事 告訴;main men 主要的 男人們;age edge 年齡 邊緣;sale sell 特價 賣"],
   ["/əʊ/ 嘴形變圓 vs /ɒ/ 或 /ɔː/","coat caught 外套 抓到了;note not 筆記 不;bowl ball 碗 球;low law 低的 法律"],
   ["/aɪ/ vs /eɪ/ 注意起始嘴形","lie lay 說謊 放置;bike bake 腳踏車 烘焙;high hay 高的 乾草;buy bay 買 海灣;pie pay 派 付錢"],
   ["p 不震動帶氣 vs b 震動","pear bear 梨子 熊;pin bin 別針 垃圾桶;pride bride 驕傲 新娘;pour bore 倒 使無聊"],
   ["t 帶氣不震動 vs d 震動","tie die 領帶 死;town down 城鎮 向下;time dime 時間 十分硬幣;tip dip 小費 蘸"],
   ["k 帶氣不震動 vs g 震動","cold gold 冷的 黃金;came game 來了 遊戲;crew grew 船員 成長;clue glue 線索 膠水"],
   ["h 要輕輕送氣，不要漏掉","hair air 頭髮 空氣;heat eat 熱 吃;hold old 握住 老的"],
   ["m 雙唇閉合 vs n 舌尖頂上顎","mine nine 我的 九;met net 遇見 網子;might night 可能 夜晚;map nap 地圖 午睡"]
  ];
  const sound=[];let n=0;const SJ=[["I","我"],["She","她"],["They","他們"],["He","他"],["We","我們"],["You","你"],["My friend","我的朋友"]];
  G.forEach(([t,s])=>s.split(";").forEach(p=>{
    const [a,b,x,y]=p.split(" "),q=SJ[n%7],e=n++%2===0,u=e?a:b,w=e?b:a,uz=e?x:y,wz=e?y:x,tt="對比練習："+t;
    sound.push([`${q[0]} said "*${a}*" and then "*${b}*" very slowly, but the others still could not hear any difference, so everybody tried again.`,`${q[1]}把「${x}」和「${y}」說得很慢，但其他人還是聽不出差別，所以大家又試了一次。`,tt,""]);
    sound.push([`${q[0]} meant "*${u}*" and not "*${w}*", but the listener misunderstood the word, so the whole conversation had to start over.`,`${q[1]}指的是「${uz}」而不是「${wz}」，但聽的人誤解了這個字，所以整段對話必須重來。`,tt,""]);
    sound.push([`Is it "*${a}*" or "*${b}*" that you want to practice first, because both words sound similar, yet each one has a different meaning?`,`你想先練習「${x}」還是「${y}」，因為這兩個字聽起來很像，但各自的意思不同？`,"選擇問句：第一項上揚，第二項下降。"+t,"↗ ↗ ↘"]);
    sound.push([`Please say "*${a}*" and then "*${b}*", pause between them, and listen carefully, because the vowel and consonant sounds are not exactly the same.`,`請先說「${x}」再說「${y}」，兩個字之間停一下並仔細聽，因為母音和子音的發音並不完全相同。`,tt,""]);
    sound.push([`${q[0]} said "*${w}*" three times in a row, but the teacher smiled and explained that it should be "*${u}*" instead.`,`${q[1]}連續說了三次「${wz}」，但老師微笑著解釋說應該是「${uz}」才對。`,tt,""]);
  }));

  /* ---------- 語調：100 句 ---------- */
  const VP=("like coffee|喜歡咖啡;need help|需要幫忙;live here|住在這裡;speak English|說英文;play tennis|打網球;drive to work|開車上班;love music|愛音樂;want some water|想喝水;know him|認識他;watch movies|看電影;"+
   "study every day|每天讀書;cook dinner|煮晚餐;walk to school|走路上學;read books|看書;work here|在這裡工作;eat breakfast|吃早餐;take the bus|搭公車;enjoy travel|喜歡旅行;have a car|有車;use this app|用這個 App;"+
   "sing in the shower|在浴室唱歌;wake up early|早起;hate Mondays|討厭星期一;miss home|想家;believe him|相信他;remember names|記得名字;visit relatives|拜訪親戚;buy fruit|買水果;wear glasses|戴眼鏡;feel tired|覺得累;make breakfast|做早餐;take photos|拍照;ride a bike|騎腳踏車;learn Chinese|學中文;call home|打電話回家;drink tea|喝茶;write letters|寫信;play games|玩遊戲;go shopping|去逛街;stay up late|熬夜;need more time|需要更多時間;want to leave|想離開;play the piano|彈鋼琴;like fish|喜歡吃魚;understand this|了解這個;trust doctors|相信醫生;love this job|愛這份工作;like our boss|喜歡我們的老闆;keep a diary|寫日記;make mistakes|犯錯;pay by card|用卡付款;take medicine|吃藥;ride the train|搭火車;ask questions|問問題;share a room|合住一間房;run every morning|每天早上跑步;clean the kitchen|打掃廚房;check the news|看新聞;walk the dog|遛狗;tell the truth|說實話;take a nap|午睡;do homework|寫作業;join the club|加入社團;save money|存錢;miss the bus|錯過公車;take a shower|洗澡;brush twice a day|一天刷兩次牙;meet new people|認識新朋友;feel nervous|覺得緊張;say thank you|說謝謝").split(";").map(x=>x.split("|"));
  const into=[];
  const SB=[["you","你","do"],["we","我們","do"],["they","他們","do"],["he","他","does"],["she","她","does"]];
  const ST=[["I","我","do"],["You","你","do"],["We","我們","do"],["They","他們","do"]];
  const SN=[["I","我","do"],["You","你","do"],["We","我們","do"],["They","他們","do"],["He","他","does"],["She","她","does"]];
  const Q=a=>a==="do"?"Do":"Does",N=a=>a==="do"?"don't":"doesn't";
  VP.forEach(([e,z],j)=>{const [s,sz,a]=SB[j%5];into.push([nuc(`${Q(a)} ${s} ${e}?`),`${sz}${z}嗎？`,"Yes/No 問句：句尾語調上揚。","↗"])});
  VP.forEach(([e,z],j)=>{const [s,sz]=ST[(j+1)%4];into.push([nuc(`${s} ${e}.`),`${sz}${z}。`,"陳述句：句尾語調下降，聽起來肯定。","↘"])});
  VP.forEach(([e,z],j)=>{const [s,sz,a]=SB[(j+2)%5];into.push([nuc(`Why ${a} ${s} ${e}?`),`${sz}為什麼${z}？`,"疑問詞問句（Wh-）：語調往下降。","↘"])});
  VP.forEach(([e,z],j)=>{const [s,sz,a]=ST[(j+3)%4];into.push([`${s} ${e}, ${N(a)} ${s==="I"?"I":s.toLowerCase()}?`,`${sz}${z}，對吧？`,"附加問句（確認用）：don't 語調上揚。","↗"])});
  VP.forEach(([e,z],j)=>{const [s,sz,a]=SN[(j+4)%6];into.push([nuc(`${s} ${N(a)} ${e}.`),`${sz}${z.startsWith("有")?"沒有"+z.slice(1):"不"+z}。`,"否定句：don't / doesn't 要清楚，句尾語調下降。","↘"])});
  VP.forEach(([e,z],j)=>{const [s,sz,a]=SB[(j+1)%5];into.push([nuc(`How often ${a} ${s} ${e}?`),`${sz}多常${z}？`,"疑問詞問句：重音在 often，句尾語調下降。","↘"])});
  VP.forEach(([e,z],j)=>{const [s,sz,a]=SB[(j+3)%5];into.push([nuc(`${Q(a)} ${s} *really* ${e}?`),`${sz}真的${z}嗎？`,"表示驚訝的確認：really 加重，句尾上揚。","↗"])});
  "tea coffee juice 茶 咖啡 果汁;rice noodles soup 米飯 麵條 湯;red blue green 紅色 藍色 綠色;pens pencils markers 原子筆 鉛筆 麥克筆;trains buses taxis 火車 公車 計程車;apples bananas grapes 蘋果 香蕉 葡萄;Monday Tuesday Friday 星期一 星期二 星期五;cats dogs birds 貓 狗 鳥;milk bread eggs 牛奶 麵包 雞蛋;pizza pasta salad 披薩 義大利麵 沙拉"
   .split(";").forEach(p=>{const [a,b,c,x,y,z]=p.split(" ");
    into.push([`Would you like *${a}*, *${b}*, or *${c}*?`,`你想要${x}、${y}還是${z}？`,"列舉選項：前面每項上揚，最後一項下降。","↗ ↗ ↘"])});

  /* ---------- 節奏：100 句 ---------- */
  const rhythm=[];
  const SUB=[["I","我"],["We","我們"],["They","他們"],["You","你"],["He","他"],["She","她"]];const c3=v=>v==="try"?"tries":v==="have"?"has":v+"s";
  const V1=[["want","想"],["need","需要"],["plan","打算"],["try","試著"],["like","喜歡"],["hope","希望"],["forget","忘記"],["have","必須"],["decide","決定"],["prefer","比較喜歡"],["refuse","拒絕"],["promise","答應"],["agree","同意"],["start","開始"]];
  const PR="buy milk 買 牛奶;read book 讀 書;fix car 修 車;call doctor 打電話給 醫生;clean room 打掃 房間;open window 打開 窗戶;wash dishes 清洗 碗盤;paint wall 粉刷 牆壁;visit museum 參觀 博物館;pack bag 收拾 包包;cook rice 煮 米飯;feed cat 餵 貓;send letter 寄 信;lock door 鎖 門;move table 搬 桌子;bake bread 烤 麵包;water plants 澆 植物;throw trash 丟 垃圾;hang picture 掛 畫;sweep floor 掃 地板".split(";").map(x=>x.split(" "));
  let k=0;
  V1.forEach(([v,vz])=>PR.forEach(([a,b,az,bz])=>{const j=k++%6,[s,sz]=SUB[j],vv=j>3?c3(v):v;
    rhythm.push([`${s} *${vv}* to *${a}* the *${b}*.`,`${sz}${vz}${az}${bz}。`,"重音詞（色塊）唸重唸長；to 弱讀成 /tə/，the 弱讀成 /ðə/，快速帶過。",""])}));

 ["the psychologist who studied decision making under pressure|研究壓力下決策的心理學家;the philosopher whose essay questioned the nature of free will|其文章質疑自由意志本質的哲學家;the researcher who replicated the original experiment|重複原始實驗的研究者","concluded that intuition is shaped by prior experience|結論認為直覺是由過去經驗塑造的;acknowledged that the findings had significant limitations|承認研究結果有重大限制;proposed a more rigorous methodology for future studies|為未來研究提出了更嚴謹的方法","the results contradicted earlier expectations|結果與先前預期相矛盾;the journal published a critical response|期刊刊登了批判性的回應;the sample size proved insufficient|樣本數證明不足"]]};
const JJ={hs:[["Although","雖然","，"],["After","在","之後，"],["Before","在","之前，"],["Once","一旦","，"],["Even though","儘管","，"]],
 uni:[["Although","雖然","，"],["Even though","儘管","，"],["Once","一旦","，"],["After","在","之後，"],["Notwithstanding the fact that","儘管事實上","，"]]};
function adv2(L){
  const X=s=>s.split(";").map(x=>x.split("|")),cap=s=>s[0].toUpperCase()+s.slice(1);
  const pk=(t,Ls)=>{let q=t,p=0;return Ls.map(n=>{const d=((q%n)+p)%n;p=d;q=Math.floor(q/n);return d})};
  const T=TOP[L].map(t=>t.map(X)),b=L==="base",N=b?500:250,R={sound:[],into:[],rhythm:[]};
  for(let g=0;g<N;g++){
    const tp=g%T.length;let en,zh;
    if(b){const tm=Math.floor(g/5)%4,[s,p,c]=pk(Math.floor(g/20),[3,3,3]),S=T[tp][0][s],P=T[tp][1][p],C=T[tp][2][c],w=tm%2?["but","但"]:["and","而"];
      if(tm<2){en=`${cap(C[0])}, ${w[0]} ${S[0]} ${P[0]}.`;zh=`${C[1]}，${w[1]}${S[1]}${P[1]}。`}
      else{en=`${cap(S[0])} ${P[0]}, ${w[0]} ${C[0]}.`;zh=`${S[1]}${P[1]}，${w[1]}${C[1]}。`}
    }else{const tm=Math.floor(g/4)%2,cn=Math.floor(g/8)%5,[s,p,c]=pk(Math.floor(g/40),[3,3,3]),S=T[tp][0][s],P=T[tp][1][p],C=T[tp][2][c],J=JJ[L][cn];
      en=tm?`${cap(S[0])} ${P[0]} ${J[0].toLowerCase()} ${C[0]}.`:`${J[0]} ${C[0]}, ${S[0]} ${P[0]}.`;
      zh=`${J[1]}${C[1]}${J[2]}${S[1]}${P[1]}。`}
    const m=[];
    R.rhythm.push([en.replace(/[A-Za-z']+/g,w=>FW.has(w.toLowerCase())?w:"*"+w+"*"),zh,"長句節奏：每個內容詞（色塊）一個重音，功能詞（the、of、that、who…）輕而快；逗號與連接詞前稍作停頓。",""]);
    R.into.push([en.replace(/([A-Za-z']+)([,.])/g,"*$1*$2"),zh,"逗號處語調上揚並停頓，表示話還沒說完；句尾下降。色塊字是各子句的核心重音。",Array((en.match(/,/g)||[]).length).fill("↗").concat("↘").join(" ")]);
    const e=en.replace(/[A-Za-z']+/g,w=>!FW.has(w.toLowerCase())&&/th|v|sh|tion|sion|ough|ph/i.test(w)?(m.push(w),"*"+w+"*"):w);
    R.sound.push([e,zh,(m.length?"重點發音："+[...new Set(m.map(w=>w.toLowerCase()))].slice(0,5).join("、")+"。注意 th、v、-tion、-ough 等音，":"")+"先慢速逐字唸，再連成整句。",""]);
  }
  return R;
}
const pack=L=>{const R=adv2(L),l=L==="hs"?"（高中）":"（大學英文系）";return {[L+"_sound"]:{n:"發音",l,items:R.sound},[L+"_into"]:{n:"語調",l,items:R.into},[L+"_rhythm"]:{n:"節奏",l,items:R.rhythm}}};
const LV={base:build(),hs:pack("hs"),uni:pack("uni")};
{const B=adv2("base");LV.base.into.items=B.into;LV.base.rhythm.items=B.rhythm}let D=LV.base,lv="base",myText="";
let cat="sound",i=0,rate=0.85,rec=null,chunks=[],done={},sc={};
const $=id=>document.getElementById(id);
function save(){try{localStorage.setItem("pc5",JSON.stringify({lv,cat,i,done,sc}))}catch(e){}}
function load(){try{const s=JSON.parse(localStorage.getItem("pc5")||"null");if(!s)return;if(LV[s.lv]){lv=s.lv;D=LV[lv]}if(D[s.cat]){cat=s.cat;i=Math.min(s.i||0,D[cat].items.length-1)}done=s.done||{};sc=s.sc||{}}catch(e){}}
function cnt(k){return Object.keys(done).filter(x=>x.startsWith(k)&&done[x]).length}
function render(){
  const L=D[cat].items,it=L[i];
  $("lvs").innerHTML=[["base","基礎複合句"],["hs","高中進階"],["uni","大學英文系"],["my","我的文章"]].map(([k,n])=>`<button class="${k===lv?"on":""}" data-l="${k}">${n}</button>`).join("");
  $("tabs").innerHTML=Object.keys(D).map(k=>`<button class="${k===cat?"on":""}" data-k="${k}">${D[k].n}</button>`).join("");
  const emp=lv==="my"&&!L.length;
  $("ed").hidden=lv!=="my";if(lv==="my")$("txt").value=myText;
  ["pc","nv","jump"].forEach(id=>$(id).hidden=emp);
  if(emp){save();return}
  $("cat").textContent=`${D[cat].n}練習　已熟練 ${cnt(cat)} / ${L.length}`;$("pos").textContent=(i+1)+" / "+L.length;
  $("en").innerHTML=html(it[0])+(it[3]?`<span class="arrow">${it[3]}</span>`:"");
  $("zh").textContent=it[1];$("tip").textContent="💡 "+it[2];
  const d=!!done[cat+i];$("done").textContent=d?"✓ 已熟練":"☆ 標記熟練";$("done").classList.toggle("dn",d);
  $("jump").innerHTML=L.map((x,n)=>`<option value="${n}" ${n===i?"selected":""}>${done[cat+n]?"✓ ":""}${n+1}. ${plain(x[0]).slice(0,30)}</option>`).join("");
  $("res").innerHTML="";$("aud").hidden=true;save();
}
function speak(){
  if(!window.speechSynthesis){$("res").textContent="此瀏覽器不支援語音朗讀，請改用 Safari（iPhone）或 Chrome（Android）直接開啟網址。";return}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(plain(D[cat].items[i][0]));
  u.lang="en-US";u.rate=rate;
  const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.replace("_","-")==="en-US");if(v)u.voice=v;
  speechSynthesis.speak(u);
}
async function toggleRec(){
  const b=$("record");
  if(rec&&rec.state==="recording"){rec.stop();return}
  try{
    const s=await navigator.mediaDevices.getUserMedia({audio:true});
    chunks=[];rec=new MediaRecorder(s);
    rec.ondataavailable=e=>chunks.push(e.data);
    rec.onstop=()=>{s.getTracks().forEach(t=>t.stop());
      const a=$("aud");a.src=URL.createObjectURL(new Blob(chunks,{type:rec.mimeType}));a.hidden=false;
      b.textContent="⏺ 錄音比較";b.classList.remove("rec");
      $("res").textContent="錄好了！按播放聽自己的聲音，再按「聽標準發音」比較。"};
    rec.start();b.textContent="⏹ 停止錄音";b.classList.add("rec");
  }catch(e){$("res").textContent="無法使用麥克風，請確認已允許權限，並用瀏覽器直接開啟 https 網址。"}
}
function score(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){$("res").textContent="此瀏覽器不支援語音辨識，請改用 Chrome 或 Safari，或使用錄音比較。";return}
  const r=new SR();r.lang="en-US";r.interimResults=false;
  $("res").textContent="🎧 請開始唸…";
  r.onresult=e=>{
    const said=e.results[0][0].transcript.toLowerCase().replace(/[^a-z' ]/g,"").split(/\s+/);
    const target=plain(D[cat].items[i][0]).split(/\s+/);
    let hit=0;
    const out=target.map(w=>{const c=w.toLowerCase().replace(/[^a-z']/g,"");
      const ok=said.includes(c);if(ok)hit++;return `<span class="${ok?"ok":"no"}">${w}</span>`}).join(" ");
    const p=Math.round(hit/target.length*100);
    const o=sc[cat+i]||{b:0,n:0};o.b=Math.max(o.b,p);o.n++;sc[cat+i]=o;save();if(!$("panel").hidden)board();
    $("res").innerHTML=`${out}<br>分數：<b>${p}</b> / 100（本句最高 ${o.b}）　${p>=90?"太棒了！🎉":p>=60?"不錯，再試一次！":"慢一點，再聽一次標準發音。"}<br><span style="color:var(--sub);font-size:13px">辨識到：${said.join(" ")}</span>`};
  r.onerror=()=>{$("res").textContent="沒有辨識到聲音，請再試一次並確認麥克風權限。"};
  r.start();
}
$("lvs").onclick=e=>{const k=e.target.dataset.l;if(k){lv=k;D=LV[k];cat=Object.keys(D)[0];i=0;render()}};
$("tabs").onclick=e=>{const k=e.target.dataset.k;if(k){cat=k;i=0;render()}};
function board(){
  const P=$("panel");let T=0,N=0,A=0;
  let h=`<b>📊 練習成績</b><small style="margin:4px 0 0">每句取「最高分」加總，重複練習只會提高該句分數，不會重複累加。</small><table><tr><th>類別</th><th>已評分</th><th>總分</th><th>平均</th></tr>`;
  const AL=Object.assign({},LV.base,LV.hs,LV.uni,LV.my);for(const k in AL){const v=Object.keys(sc).filter(x=>x.startsWith(k));const s=v.reduce((a,x)=>a+sc[x].b,0);A+=v.reduce((a,x)=>a+sc[x].n,0);T+=s;N+=v.length;
    h+=`<tr><td>${AL[k].n}${AL[k].l||""}</td><td>${v.length}/${AL[k].items.length}</td><td>${s}</td><td>${v.length?Math.round(s/v.length):"-"}</td></tr>`}
  const av=N?Math.round(T/N):0;
  h+=`</table><div style="font-size:20px;margin-top:12px">總分：<b>${T}</b> 分</div><div class="zh">已評分 ${N} 句・平均 ${av} 分・累計嘗試 ${A} 次　${av>=90?"🏆 發音達人":av>=75?"🥇 很棒":av>=60?"👍 持續進步":N?"💪 加油":""}</div><div class="row"><button id="rs">🗑 清除成績</button></div>`;
  P.innerHTML=h;$("rs").onclick=()=>{if(confirm("確定清除所有評分紀錄？")){sc={};save();board()}};
}
$("board").onclick=()=>{const P=$("panel");P.hidden=!P.hidden;if(!P.hidden)board()};
$("listen").onclick=speak;$("record").onclick=toggleRec;$("score").onclick=score;
$("done").onclick=()=>{done[cat+i]=!done[cat+i];render()};
$("next").onclick=()=>{i=(i+1)%D[cat].items.length;render()};
$("prev").onclick=()=>{i=(i-1+D[cat].items.length)%D[cat].items.length;render()};
$("rand").onclick=()=>{i=Math.floor(Math.random()*D[cat].items.length);render()};
$("jump").onchange=e=>{i=+e.target.value;render()};
document.querySelector(".speed").onclick=e=>{const r=e.target.dataset.r;if(!r)return;rate=+r;
  document.querySelectorAll(".speed button").forEach(b=>b.classList.toggle("on",b.dataset.r===r))};
function setMy(t){myText=t;LV.my=mine(t);try{localStorage.setItem("pc4my",t)}catch(e){}
  [sc,done].forEach(o=>Object.keys(o).forEach(k=>{if(k.startsWith("my_"))delete o[k]}));
  if(lv==="my"){D=LV.my;cat="my_sound";i=0}render()}
$("go").onclick=()=>setMy($("txt").value);
$("clr").onclick=()=>{$("txt").value="";setMy("")};
$("fl").onclick=()=>$("file").click();
$("file").onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{$("txt").value=rd.result;setMy(rd.result)};rd.readAsText(f)};
try{myText=localStorage.getItem("pc4my")||""}catch(e){}
LV.my=mine(myText);
load();render();
</script>
